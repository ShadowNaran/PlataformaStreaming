name: plataformastreaming-deploy

services:
  api:
    image: shadownaran/plataformastreaming-api:1.0
    pull_policy: always
    container_name: plataformastreaming-api-prod
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    ports:
      - "127.0.0.1:${API_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plataformastreaming-net

  postgres:
    image: postgres:17
    container_name: plataformastreaming-db-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Define POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data_deploy:/var/lib/postgresql/data
    networks:
      - plataformastreaming-net

networks:
  plataformastreaming-net:

volumes:
  postgres_data_deploy:
